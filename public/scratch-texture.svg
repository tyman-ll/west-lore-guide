<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="0 0 700 700">
  <defs>
    <filter id="dust" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.55
                             0 0 0 0 0.48
                             0 0 0 0 0.40
                             0 0 0 0.35 0"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="2.4" numOctaves="1" seed="3" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.60
                             0 0 0 0 0.55
                             0 0 0 0 0.50
                             0 0 0 0.10 0"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" filter="url(#grain)"/>
  <g opacity="0.35">
